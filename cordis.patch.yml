# cordis.patch.yml — dsh-switch-preset 的 DSH bundle 补丁
#
# 必须含 insert 行：patch 若为顶层空数组，插件虽进 bundles 清单但不会被实例化。
# inject 在此显式声明（0.1.7 下与插件模块的 export const inject 合并解析）；
# 插件侧静态 inject 保持为空，命令注册走二级注入（见 src/index.ts 说明）。
- insert:
  - id: switch-preset
    name: dsh-switch-preset
    inject:
      - commands
      - agentPresets
